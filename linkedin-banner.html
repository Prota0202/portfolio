<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #f7f7f7;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #1a1a1a;
    }
    .banner {
      width: 1584px;
      height: 396px;
      display: flex;
      align-items: center;
      padding: 0 64px 0 320px;
    }
    .block { max-width: 900px; }
    .name {
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #111;
    }
    .role {
      margin-top: 10px;
      font-size: 17px;
      font-weight: 400;
      color: #333;
      letter-spacing: -0.01em;
    }
    .meta {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 400;
      color: #6b6b6b;
      line-height: 1.7;
    }
    .meta span { color: #b0b0b0; margin: 0 10px; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="block">
      <p class="name">Abdelbadi Lababidi</p>
      <p class="role">Chef de projet · Consultant · Analyste</p>
      <p class="meta">
        Ingénieur industriel (informatique)
        <span>·</span>
        Bruxelles
        <span>·</span>
        Abdelbadi1@protonmail.com
        <span>·</span>
        prota0202.github.io/portfolio
      </p>
    </div>
  </div>
</body>
</html>
